<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground","default":"#FAF8F5"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#141312"},
    {"id":"color-gold","type":"color","label":"Gold","default":"#B38E46"},
    {"id":"font-display","type":"string","label":"Display font","default":"Cormorant Garamond"},
    {"id":"font-body","type":"string","label":"Body font","default":"Manrope"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dev Fashion — Bridal Couture</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-garamond-latin-variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 400 600;
        font-display: block;
      }

      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-garamond-italic-latin-variable.woff2") format("woff2");
        font-style: italic;
        font-weight: 400 600;
        font-display: block;
      }

      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope-latin-variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 400 600;
        font-display: block;
      }

      :root {
        --color-dark: #0C0C0B;
        --color-paper: #FAF8F5;
        --color-gold-soft: #D4C3A3;
        --color-gold-deep: #665022;
        --font-display: "Cormorant Garamond";
        --font-body: "Manrope";
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--color-ground);
        color: var(--color-ink);
      }

      body {
        font-family: var(--font-body), Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--color-ground);
      }

      .clip {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-onjd"
